services:
  api:
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?API avatar source URL required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?API avatar source key required}
      DISCORD_AVATAR_BOT_TOKEN: ${DISCORD_AVATAR_BOT_TOKEN:?API avatar bot token required}
      DISCORD_AVATAR_WORKER_ENABLED: ${DISCORD_AVATAR_WORKER_ENABLED:-0}
      DISCORD_AVATAR_REFRESH_SECONDS: ${DISCORD_AVATAR_REFRESH_SECONDS:-604800}
      DISCORD_AVATAR_SCAN_SECONDS: ${DISCORD_AVATAR_SCAN_SECONDS:-300}
      DISCORD_AVATAR_REQUEST_SPACING: ${DISCORD_AVATAR_REQUEST_SPACING:-2}
